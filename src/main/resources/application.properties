spring.application.name=backend

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/smartcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=smartcart_user
spring.datasource.password=smartcart_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# 'update' automatically creates database tables based on the Java code
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Author: Htet Nandar (Grace)
# ===============================
# SEED DATA (data.sql)
# ===============================
# 'always' is required so data.sql runs against a real MySQL datasource (default 'embedded'
# skips it). defer-datasource-initialization=true makes it run AFTER Hibernate creates the
# schema, instead of before (which would fail with "table doesn't exist").
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Author: Htet Nandar (Grace)
# ===============================
# AI MICROSERVICE (smartcart-ai-service, nested under this project)
# ===============================
ai.python-service.base-url=http://localhost:8001
ai.python-service.connect-timeout-seconds=5
ai.python-service.read-timeout-seconds=60