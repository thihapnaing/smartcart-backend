name: Java Spring Boot CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  AWS_REGION: us-east-1       # must match terraform/terraform.tfvars aws_region
  EKS_CLUSTER_NAME: smartcart-eks # must match terraform/terraform.tfvars cluster_name
  # Branch of thihapnaing/smartcart-web to build the frontend image from.
  # Pinned to "thiha" because that's currently the only branch there with a
  # Dockerfile - main doesn't have one yet. Switch this to "main" (or
  # "develop") once that repo merges its Dockerfile there.
  FRONTEND_REPO_REF: thiha

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Required by SonarCloud for accurate code history analysis
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Enabled Maven dependency caching for faster builds
      - name: Build, Test, and Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=thihapnaing_smartcart-backend

  scan-backend-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build backend image
        run: docker build -t smartcart-backend-backend:${{ github.sha }} .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: smartcart-backend-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          # Without this, trivy-action silently discards the severity filter
          # above for SARIF output and scans/fails on ALL severities instead
          # (see aquasecurity/trivy-action's entrypoint.sh SARIF handling).
          limit-severities-for-sarif: 'true'
          exit-code: '1' # Fail the job if any CRITICAL/HIGH finding isn't already fixed
          trivyignores: .trivyignore # Skip findings already triaged and accepted

      - name: Upload results to GitHub Security tab
        if: always() # Upload even if the scan step above failed the job
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

  scan-ai-service-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build AI service image
        run: docker build -t smartcart-ai-service:${{ github.sha }} ./smartcart-ai-service

      - name: Scan AI service image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: smartcart-ai-service:${{ github.sha }}
          format: sarif
          output: trivy-ai-service-results.sarif
          severity: CRITICAL,HIGH
          # Without this, trivy-action silently discards the severity filter
          # above for SARIF output and scans/fails on ALL severities instead
          # (see aquasecurity/trivy-action's entrypoint.sh SARIF handling).
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          trivyignores: smartcart-ai-service/.trivyignore # Skip findings already triaged and accepted

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-ai-service-results.sarif
          category: trivy-ai-service

  # The frontend lives in a separate repo (thihapnaing/smartcart-web, public)
  # rather than this one, so it's checked out explicitly here and in
  # push-images below - jobs don't share a workspace, and this workflow only
  # auto-checks-out the repo it lives in otherwise.
  scan-frontend-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thihapnaing/smartcart-web
          ref: ${{ env.FRONTEND_REPO_REF }}
          path: smartcart-web
          # No token override - defaults to github.token. That's scoped to
          # this (backend) repo, but works fine here anyway since
          # smartcart-web is public and public clones don't require the
          # token to match the repo being cloned.

      - name: Build frontend image
        run: docker build -t smartcart-frontend:${{ github.sha }} ./smartcart-web

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: smartcart-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          # Without this, trivy-action silently discards the severity filter
          # above for SARIF output and scans/fails on ALL severities instead
          # (see aquasecurity/trivy-action's entrypoint.sh SARIF handling).
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          # No trivyignores here - smartcart-web doesn't have a .trivyignore
          # yet. Add one there and reference it here if/when needed.

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

  push-images:
    needs: [ scan-backend-image, scan-ai-service-image, scan-frontend-image ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to assume the AWS role via OIDC
      contents: read
    outputs:
      backend-image: ${{ steps.tags.outputs.backend-image }}
      ai-service-image: ${{ steps.tags.outputs.ai-service-image }}
      frontend-image: ${{ steps.tags.outputs.frontend-image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout frontend repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thihapnaing/smartcart-web
          ref: ${{ env.FRONTEND_REPO_REF }}
          path: smartcart-web
          # No token override - defaults to github.token. That's scoped to
          # this (backend) repo, but works fine here anyway since
          # smartcart-web is public and public clones don't require the
          # token to match the repo being cloned.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # Rebuilt here rather than reused from the scan jobs above - passing a
      # multi-hundred-MB image between jobs as an artifact is slower and
      # more fiddly than a second `docker build`, and Docker's layer cache
      # keeps this cheap anyway.
      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/smartcart-backend:${{ github.sha }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/smartcart-backend:${{ github.sha }}

      - name: Build and push AI service image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/smartcart-ai-service:${{ github.sha }} ./smartcart-ai-service
          docker push ${{ steps.ecr-login.outputs.registry }}/smartcart-ai-service:${{ github.sha }}

      # Tagged with this repo's SHA (not smartcart-web's own) so all 3
      # images from one pipeline run share a single traceable tag, even
      # though the frontend source technically comes from a different repo.
      - name: Build and push frontend image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/smartcart-frontend:${{ github.sha }} ./smartcart-web
          docker push ${{ steps.ecr-login.outputs.registry }}/smartcart-frontend:${{ github.sha }}

      - name: Record image tags for the deploy job
        id: tags
        run: |
          echo "backend-image=${{ steps.ecr-login.outputs.registry }}/smartcart-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ai-service-image=${{ steps.ecr-login.outputs.registry }}/smartcart-ai-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend-image=${{ steps.ecr-login.outputs.registry }}/smartcart-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: push-images
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # Idempotent create-or-update: builds the Secret locally and applies
      # it, rather than `kubectl create` which would fail with "already
      # exists" on every run after the first.
      - name: Create/update app secrets in cluster
        # Secrets are passed via env rather than expanded directly into the
        # run script - keeps their values out of the literal command text
        # (shell history, step debug logs) and avoids any shell-metacharacter
        # in a secret being interpreted when the expression is substituted.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          kubectl create secret generic smartcart-secrets \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --from-literal=CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            --from-literal=CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
            --from-literal=CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
            --from-literal=TAVILY_API_KEY="$TAVILY_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ingress.yaml is excluded - it's Minikube-only (relies on that
      # cluster's nginx ingress addon, which this EKS cluster doesn't have).
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/ai-service-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

      - name: Point deployments at the images just pushed
        run: |
          kubectl set image deployment/backend backend=${{ needs.push-images.outputs.backend-image }}
          kubectl set image deployment/smartcart-ai-service smartcart-ai-service=${{ needs.push-images.outputs.ai-service-image }}
          kubectl set image deployment/frontend frontend=${{ needs.push-images.outputs.frontend-image }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/smartcart-ai-service --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Show frontend LoadBalancer address
        # http:// here reflects reality, not a suggestion: the frontend
        # Service is a plain L4 LoadBalancer with no TLS listener/cert
        # configured (see k8s/frontend-deployment.yaml), so this is the
        # actual scheme the printed URL is reachable on today. NOSONAR
        run: |
          kubectl get service frontend -o jsonpath='Frontend URL: http://{.status.loadBalancer.ingress[0].hostname}{"\n"}' # NOSONAR
