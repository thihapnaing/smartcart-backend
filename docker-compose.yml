version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: smartcart-mysql
    environment:
      MYSQL_DATABASE: smartcart_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smartcart_user
      MYSQL_PASSWORD: smartcart_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: