name: Java Spring Boot CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarCloud for accurate code history analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Enabled Maven dependency caching for faster builds
      - name: Build, Test, and Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=thihapnaing_smartcart-backend

  scan-backend-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smartcart-backend-backend:${{ github.sha }} .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: smartcart-backend-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1' # Fail the job if any CRITICAL/HIGH finding isn't already fixed

      - name: Upload results to GitHub Security tab
        if: always() # Upload even if the scan step above failed the job
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

  scan-ai-service-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build AI service image
        run: docker build -t smartcart-ai-service:${{ github.sha }} ./smartcart-ai-service

      - name: Scan AI service image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: smartcart-ai-service:${{ github.sha }}
          format: sarif
          output: trivy-ai-service-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: smartcart-ai-service/.trivyignore # Skip findings already triaged and accepted

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-ai-service-results.sarif
          category: trivy-ai-service