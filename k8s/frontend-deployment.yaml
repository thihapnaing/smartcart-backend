# SmartCart frontend (nginx), deployed to the school-project EKS cluster
# (see terraform/). The image below is a placeholder - the CI deploy job
# runs `kubectl set image` right after `kubectl apply` to point this at the
# real ECR image + git-SHA tag it just pushed (see
# .github/workflows/backend.yml, which checks out and builds
# thihapnaing/smartcart-web even though that source isn't in this repo).
#
# Service is LoadBalancer so AWS provisions a public entry point - no
# Ingress controller needed, since nginx.conf already proxies /api/ to the
# `backend` Service internally, same as it does in docker-compose.
#
# Reviving Minikube local testing: swap the image back to
# `frontend-app:latest` with `imagePullPolicy: Never`, and the Service back
# to type: NodePort.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: PLACEHOLDER-ECR-REGISTRY/smartcart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080