# ===============================
# H2 IN-MEMORY DATABASE FOR TESTS
# ===============================
spring.datasource.url=jdbc:h2:mem:smartcart_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# HIBERNATE SETTINGS
# ===============================
# 'create-drop' builds the tables when tests start, and deletes them when tests finish
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.sql.init.mode=never
# need this if we have a data.sql script
spring.jpa.defer-datasource-initialization=true

# ===============================
# AI MICROSERVICE (dummy values for tests - never actually called)
# ===============================
ai.python-service.base-url=http://localhost:8001
ai.python-service.connect-timeout-seconds=5
ai.python-service.read-timeout-seconds=60

# ===============================
# CLOUDINARY (dummy values - tests never make real API calls,
# but CloudinaryConfig needs something to resolve at context startup)
# ===============================
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# ===============================
# JWT AUTHENTICATION (dummy values)
# ===============================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000