spring.application.name=backend

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/smartcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=trueq
spring.datasource.username=smartcart_user
spring.datasource.password=smartcart_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# 'update' automatically creates database tables based on the Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect